name: Build APK
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev cmake libffi-dev libssl-dev libltdl-dev
          
          # Extrémne stabilné verzie nástrojov pre Android kompiláciu
          pip install "pip==23.1.2" "setuptools==68.0.0" virtualenv wheel
          
          # Inštalácia najnovšieho opraveného Buildozera priamo z GitHubu
          pip install https://github.com/kivy/buildozer/archive/master.zip
          pip install cython==0.29.33

      - name: Build
        run: yes | buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZSSK-APK-v8
          path: bin/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: build-${{ github.run_number }}
          name: ZSSK Zmeny (Build ${{ github.run_number }})
          files: bin/*.apk
          draft: false
          prerelease: false
